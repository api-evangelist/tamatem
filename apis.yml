aid: tamatem
name: Tamatem
description: Tamatem is a Jordan-based mobile games publisher and platform focused on the Arabic-speaking
  MENA market. It localizes and publishes mobile games for Arab gamers and operates Tamatem Plus
  (tamatemplus.com), a consumer store for game vouchers, in-game items, and top-ups with a range of local
  payment options. Backed by 500 Global. As of this enrichment pass Tamatem publishes no public developer
  portal, API documentation, SDKs, or machine-readable API surface — it is a consumer-facing gaming and
  digital-goods business, so this profile carries identity and a domain-security probe rather than API
  artifacts.
